[project]
name = "atlas"
version = "1.1.7"
description = "Evidence-backed inventory and admin panel for one Linux server."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Semen Saifutdinov" }]
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "pydantic>=2.9.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32.0",
    "websockets>=13.1",
]

[project.scripts]
atlas = "atlas.cli.main:main"

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "hypothesis>=6.112.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["atlas", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlas"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["atlas"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["psutil", "yaml", "pyotp", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["atlas"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
