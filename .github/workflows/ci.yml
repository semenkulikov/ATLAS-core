name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --frozen --project backend --group dev
      - name: Lint
        run: uv run --project backend ruff check backend && uv run --project backend ruff format --check backend
      - name: Types
        run: uv run --project backend mypy --config-file backend/pyproject.toml backend/atlas
      - name: Tests
        run: >
          uv run --project backend pytest backend/tests
          --cov=atlas.domain --cov=atlas.detectors --cov=atlas.security
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Bandit
        run: uv run --project backend bandit -q -r backend/atlas -c backend/pyproject.toml
      - name: Dependency audit
        run: uv run --project backend pip-audit backend
      - name: Semgrep
        run: |
          python3 -m pip install --user 'semgrep>=1.76'
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config p/python --error --metrics=off backend/atlas

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        working-directory: frontend
        run: npm ci && npm test && npm run check
